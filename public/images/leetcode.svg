<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <!-- Background -->
  <rect width="320" height="100" fill="#0E0E10"/>

  <!-- LeetCode Icon -->
  <!-- Outer curve -->
  <path d="M60 30
           A25 25 0 1 1 60 70"
        fill="none"
        stroke="#FFA116"
        stroke-width="10"
